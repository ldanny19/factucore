spring:
  application:
    name: facturador

factucore:
  logging:
    nivel: ${FACTUCORE_LOGGING_NIVEL:INFO}
    ruta: ${FACTUCORE_LOGGING_RUTA:./logs}
    archivo: ${FACTUCORE_LOGGING_ARCHIVO:factucore.log}

  messaging:
    enabled: ${FACTUCORE_MESSAGING_ENABLED:true}
    broker: ${FACTUCORE_MESSAGING_BROKER:KAFKA}

    kafka:
      bootstrap-servers: ${FACTUCORE_MESSAGING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      security-protocol: ${FACTUCORE_MESSAGING_KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      client-id: ${FACTUCORE_MESSAGING_KAFKA_CLIENT_ID:factucore-facturador}
      producer:
        acks: all
      consumer:
        auto-offset-reset: earliest
        enable-auto-commit: false
        concurrency: 1

    rabbitmq:
      addresses: ${FACTUCORE_MESSAGING_RABBITMQ_ADDRESSES:localhost:5672}
      username: ${FACTUCORE_MESSAGING_RABBITMQ_USERNAME:guest}
      password: ${FACTUCORE_MESSAGING_RABBITMQ_PASSWORD:guest}
      virtual-host: ${FACTUCORE_MESSAGING_RABBITMQ_VIRTUAL_HOST:/}
      exchange-type: topic
      exchange-prefix: factucore
      durable: true

    retry:
      intervalo-ms: ${FACTUCORE_MESSAGING_RETRY_INTERVALO_MS:5000}
      max-intentos: ${FACTUCORE_MESSAGING_RETRY_MAX_INTENTOS:3}
      dlq-habilitada: ${FACTUCORE_MESSAGING_RETRY_DLQ_HABILITADA:true}
      sufijo-dlq: ${FACTUCORE_MESSAGING_RETRY_SUFIJO_DLQ:.DLQ}

  notificacion:
    topico: ${FACTUCORE_NOTIFICACION_TOPICO:factucore.notificacion}
    tipo-evento: ${FACTUCORE_NOTIFICACION_TIPO_EVENTO:COMPROBANTE_AUTORIZADO}
    version-evento: ${FACTUCORE_NOTIFICACION_VERSION_EVENTO:1.0}

  seguridad:
    habilitada: ${FACTUCORE_SEGURIDAD_HABILITADA:false}
    oauth2:
      issuer-uri: ${FACTUCORE_SEGURIDAD_OAUTH2_ISSUER_URI:http://localhost:8080/realms/factucore}
