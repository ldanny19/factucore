spring:
  application:
    name: factucore-auditoria

factucore:
  messaging:
    enabled: true
    conexiones:
      kafka-principal:
        tipo: KAFKA
        kafka:
          bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    destinos:
      auditoria:
        conexion: kafka-principal
        nombre: auditoria

  auditoria:
    peticion:
      grupo-consumidor: ${FACTUCORE_AUDITORIA_PETICION_GRUPO:factucore-auditoria}

management:
  endpoints:
    web:
      exposure:
        include: health,info
