spring:
  application:
    name: factucore-auditoria

factucore:
  messaging:
    enabled: true
    broker: KAFKA
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  auditoria:
    peticion:
      topico: ${FACTUCORE_AUDITORIA_PETICION_TOPICO:factucore.auditoria.peticion}
      grupo-consumidor: ${FACTUCORE_AUDITORIA_PETICION_GRUPO:factucore-auditoria}

management:
  endpoints:
    web:
      exposure:
        include: health,info
