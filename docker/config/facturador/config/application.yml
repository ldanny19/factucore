# ============================================================
# FACTUCORE - FACTURADOR
# CONFIGURACION EXTERNA
# ============================================================

spring:
  application:
    name: facturador

  messages:
    basename: "file:${factucore.path.config}/messages"
    encoding: UTF-8
    fallback-to-system-locale: false

  main:
    banner-mode: off

  datasource:
    url: ${DB_URL:jdbc:postgresql://db_factucore:5432/feFactuCore}
    username: ${DB_USERNAME:usr_factucore}
    password: ${DB_PASSWORD:usr_factucore}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: FactuCoreHikariCP
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Guayaquil

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: ec.dalara.factucore.*
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}

server:
  port: 8083
  servlet:
    context-path: /factucore-api

logging:
  level:
    root: INFO
    ec.dalara.factucore: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: INFO
  file:
    name: "${factucore.path.logs}/facturador.log"

factucore:
  path:
    base: C:/factucore/facturador
    config: C:/factucore/facturador/config
    certificados: C:/factucore/facturador/certificados
    jasper: C:/factucore/facturador/jasper
    documentos: C:/factucore/facturador/documentos
    documentos-xml: C:/factucore/facturador/documentos/xml
    documentos-pdf: C:/factucore/facturador/documentos/pdf
    logs: C:/factucore/facturador/logs

  sri:
    envio:
      max-intentos: ${FACTUCORE_SRI_ENVIO_MAX_INTENTOS:3}
      espera-ms: ${FACTUCORE_SRI_ENVIO_ESPERA_MS:5000}
    autorizacion:
      espera-ms: ${FACTUCORE_SRI_AUTORIZACION_ESPERA_MS:5000}
      max-intentos: ${FACTUCORE_SRI_AUTORIZACION_MAX_INTENTOS:5}

  workflow:
    reproceso:
      habilitado: ${FACTUCORE_WORKFLOW_REPROCESO_HABILITADO:true}

  kafka:
    topics:
      notificacion-comprobante: ${FACTUCORE_KAFKA_TOPIC_NOTIFICACION_COMPROBANTE:factucore.notificacion.comprobante}