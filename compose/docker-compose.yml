name: factucore

services:

  vault:
    image: hashicorp/vault:1.20
    container_name: factucore-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://vault:8200
      SKIP_CHOWN: "true"
    command: ["server", "-config=/vault/config/config.hcl"]
    volumes:
      - ${FACTUCORE_HOME}/vault/data:/vault/data
      - ${FACTUCORE_HOME}/vault/config:/vault/config:ro
    ports:
      - "${VAULT_PORT:-8200}:8200"

  vault-bootstrap:
    image: hashicorp/vault:1.20
    container_name: factucore-vault-bootstrap
    restart: "no"
    depends_on:
      vault:
        condition: service_started
    environment:
      VAULT_ADDR: http://vault:8200
      FACTUCORE_POSTGRES_PASSWORD: ${FACTUCORE_POSTGRES_PASSWORD:-}
      FACTUCORE_KEYCLOAK_ADMIN_PASSWORD: ${FACTUCORE_KEYCLOAK_ADMIN_PASSWORD:-}
    volumes:
      - ./vault/scripts:/vault/scripts:ro
      - ./vault/policy:/vault/policy:ro
      - ${FACTUCORE_HOME}/secrets:/vault/bootstrap-secrets
    entrypoint: ["/bin/sh", "-c"]
    command: /vault/scripts/bootstrap-vault.sh

  vault-agent:
    image: hashicorp/vault:1.20
    container_name: factucore-vault-agent
    restart: unless-stopped
    depends_on:
      vault-bootstrap:
        condition: service_completed_successfully
    command: agent -config=/vault/agent/config.hcl
    environment:
      VAULT_ADDR: http://vault:8200
    volumes:
      - ./vault/agent:/vault/agent:ro
      - type: bind
        source: ${FACTUCORE_HOME}/secrets/vault_agent_token.txt
        target: /run/secrets/vault_agent_token
        read_only: true
        bind:
          create_host_path: false
      - factucore_vault_secrets:/vault/secrets
    healthcheck:
      test: ["CMD-SHELL", "test -s /vault/secrets/postgres_password && test -s /vault/secrets/keycloak_admin_password"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  db_factucore:
    image: postgres:17
    container_name: db_factucore
    restart: unless-stopped
    depends_on:
      vault-agent:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-factucore}
      POSTGRES_USER: ${POSTGRES_USER:-usr_factucore}
      POSTGRES_PASSWORD_FILE: /vault/secrets/postgres_password
    volumes:
      - ${FACTUCORE_HOME}/data/postgres:/var/lib/postgresql/data
      - factucore_vault_secrets:/vault/secrets:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  auth-server:
    image: keycloak/keycloak:26.7.4-0
    container_name: auth-server
    restart: unless-stopped
    depends_on:
      vault-agent:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
    command:
      - exec /opt/keycloak/bin/kc.sh start --http-port=8080 --bootstrap-admin-username="\\$\\$KC_BOOTSTRAP_ADMIN_USERNAME" --bootstrap-admin-password="\\$\\$(cat /vault/secrets/keycloak_admin_password)"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
    volumes:
      - factucore_vault_secrets:/vault/secrets:ro
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"

  kafka:
    image: apache/kafka:4.0.2
    depends_on:
      vault-agent:
        condition: service_healthy
    container_name: factucore-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  facturador:
    # build:
    #   context: ..
    #   dockerfile: facturador/Dockerfile
    image: factucore-facturador:${FACTUCORE_VERSION:?FACTUCORE_VERSION es obligatoria}
    container_name: factucore-facturador
    restart: unless-stopped
    depends_on:
      db_factucore:
        condition: service_healthy
        restart: true
      vault-agent:
        condition: service_healthy
      kafka:
        condition: service_started
      auth-server:
        condition: service_started
      vault:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: ${DB_URL:-jdbc:postgresql://db_factucore:5432/factucore}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-usr_factucore}
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/
      SPRING_DATASOURCE_PASSWORD_FILE: /vault/secrets/postgres_password
      FACTUCORE_SEGURIDAD_HABILITADA: ${FACTUCORE_SEGURIDAD_HABILITADA:-false}
      FACTUCORE_SEGURIDAD_OAUTH2_ISSUER_URI: ${FACTUCORE_SEGURIDAD_OAUTH2_ISSUER_URI:-http://auth-server:8080/realms/factucore}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      FACTUCORE_SRI_AMBIENTE: ${FACTUCORE_SRI_AMBIENTE:-PRUEBAS}
    volumes:
      - factucore_vault_secrets:/run/secrets:ro
      - ${FACTUCORE_HOME}/config/facturador:/app/config:ro
      - ${FACTUCORE_HOME}/documentos:/app/documentos
      - ${FACTUCORE_HOME}/certificados:/app/certificados:ro
      - ${FACTUCORE_HOME}/logs/facturador:/app/logs
    ports:
      - "${FACTURADOR_PORT:-8081}:8083"

  notificacion:
    # build:
    #   context: ..
    #   dockerfile: notificacion/Dockerfile
    image: factucore-notificacion:${FACTUCORE_VERSION:?FACTUCORE_VERSION es obligatoria}
    container_name: factucore-notificacion
    restart: unless-stopped
    depends_on:
      vault-agent:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    volumes:
      - ${FACTUCORE_HOME}/config/notificacion:/app/config:ro
      - ${FACTUCORE_HOME}/documentos:/app/documentos:ro
      - ${FACTUCORE_HOME}/logs/notificacion:/app/logs
    ports:
      - "${NOTIFICACION_PORT:-8082}:8080"

volumes:
  factucore_vault_secrets:
