services:

  db_factucore:
    image: postgres:17
    container_name: db_factucore
    restart: unless-stopped
    environment:
      POSTGRES_DB: factucore
      POSTGRES_USER: factucore
      POSTGRES_PASSWORD: factucore
    ports:
      - "5432:5432"
    volumes:
      - ${FACTUCORE_HOME:?Debe definir FACTUCORE_HOME}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factucore -d factucore"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-server:
    image: quay.io/keycloak/keycloak:26
    container_name: auth-server
    restart: unless-stopped
    command:
      - start-dev
      - --http-port=8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"

  kafka:
    image: apache/kafka:4.0.1
    container_name: factucore-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  facturador:
    build:
      context: ../facturador
      dockerfile: Dockerfile
    container_name: factucore-facturador
    restart: unless-stopped
    depends_on:
      db_factucore:
        condition: service_healthy
      kafka:
        condition: service_started
      auth-server:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db_factucore:5432/factucore
      SPRING_DATASOURCE_USERNAME: factucore
      SPRING_DATASOURCE_PASSWORD: factucore
      FACTUCORE_SEGURIDAD_HABILITADA: "false"
      FACTUCORE_SEGURIDAD_OAUTH2_ISSUER_URI: http://auth-server:8080/realms/factucore
      FACTUCORE_MESSAGING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ${FACTUCORE_HOME:?Debe definir FACTUCORE_HOME}/config/facturador:/app/config:ro
      - ${FACTUCORE_HOME:?Debe definir FACTUCORE_HOME}/documentos:/app/documentos
      - ${FACTUCORE_HOME}/certificados:/app/certificados:ro
      - ${FACTUCORE_HOME}/logs/facturador:/app/logs
    ports:
      - "8081:8080"

  notificacion:
    build:
      context: ../notificacion
      dockerfile: Dockerfile
    container_name: factucore-notificacion
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_started
    environment:
      FACTUCORE_MESSAGING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ${FACTUCORE_HOME:?Debe definir FACTUCORE_HOME}/config/notificacion:/app/config:ro
      - ${FACTUCORE_HOME}/documentos:/app/documentos:ro
      - ${FACTUCORE_HOME}/logs/notificacion:/app/logs
    ports:
      - "8082:8080"

