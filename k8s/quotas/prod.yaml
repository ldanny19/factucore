apiVersion: v1
kind: ResourceQuota
metadata:
  name: rq-prod
  namespace: ns-prod
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 32Gi
    limits.cpu: "32"
    limits.memory: 64Gi
    requests.storage: 150Gi
    persistentvolumeclaims: "30"
    pods: "50"
    services: "40"
    configmaps: "50"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: lr-prod
  namespace: ns-prod
spec:
  limits:
    - type: Container
      min:
        cpu: 10m
        memory: 16Mi
      max:
        cpu: "4"
        memory: 8Gi
      defaultRequest:
        cpu: 250m
        memory: 256Mi
      default:
        cpu: "1"
        memory: 1Gi
