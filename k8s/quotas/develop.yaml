apiVersion: v1
kind: ResourceQuota
metadata:
  name: rq-development
  namespace: ns-development
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    requests.storage: 50Gi
    persistentvolumeclaims: "12"
    pods: "20"
    services: "20"
    configmaps: "30"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: lr-development
  namespace: ns-development
spec:
  limits:
    - type: Container
      min:
        cpu: 10m
        memory: 16Mi
      max:
        cpu: "2"
        memory: 4Gi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
