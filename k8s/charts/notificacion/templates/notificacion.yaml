apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    app: {{ .Values.labels.app }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.labels.app }}
  template:
    metadata:
      labels:
        app: {{ .Values.labels.app }}
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: vault
                  app.kubernetes.io/component: agent
      containers:
        - name: notificacion
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: DB_URL
              value: {{ .Values.database.url | quote }}
            - name: DB_USERNAME
              value: {{ .Values.database.username | quote }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers | quote }}
            - name: FACTUCORE_NOTIFICACION_TOPICO
              value: notificacion
            - name: FACTUCORE_SEGURIDAD_OAUTH2_ISSUER_URI
              value: {{ .Values.security.issuerUri | quote }}
            - name: FACTUCORE_SEGURIDAD_OAUTH2_JWK_SET_URI
              value: {{ .Values.security.jwkSetUri | quote }}
            - name: FACTUCORE_CORS_ALLOWED_ORIGINS
              value: {{ .Values.environment.corsAllowedOrigins | quote }}
          volumeMounts:
            - name: runtime-secrets
              mountPath: /run/secrets
              readOnly: true
            - name: configuracion
              mountPath: /app/config
              readOnly: true
            - name: mensajeria-config
              mountPath: /app/messaging-config
              readOnly: true
            - name: documentos
              mountPath: /app/documentos
              readOnly: true
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: runtime-secrets
          persistentVolumeClaim:
            claimName: pvc-vault-runtime-secrets
        - name: configuracion
          configMap:
            name: cm-notificacion-config
            items:
              - key: application.yml
                path: application.yml
              - key: messages.properties
                path: messages.properties
              - key: messages_es_EC.properties
                path: messages_es_EC.properties
              - key: plantillas-comprobante-autorizado.html
                path: plantillas/comprobante-autorizado.html
        - name: mensajeria-config
          configMap:
            name: cm-messaging-config
            items:
              - key: message.properties
                path: message.properties
        - name: documentos
          persistentVolumeClaim:
            claimName: pvc-facturador-documentos
        - name: logs
          persistentVolumeClaim:
            claimName: pvc-notificacion-logs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-notificacion-logs
  labels:
    app: {{ .Values.labels.app }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.storage.logs }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
  labels:
    app: {{ .Values.labels.app }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Values.labels.app }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
