{{- if .Values.modules.facturador.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.modules.facturador.deployment.name }}
  labels:
    app: {{ .Values.modules.facturador.deployment.labels }}
spec:
  replicas: {{ .Values.modules.facturador.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.modules.facturador.deployment.labels }}
  template:
    metadata:
      labels:
        app: {{ .Values.modules.facturador.deployment.labels }}
    spec:
      containers:
        - name: facturador
          image: "{{ .Values.modules.facturador.image.repository }}:{{ .Values.modules.facturador.image.tag }}"
          imagePullPolicy: {{ .Values.modules.facturador.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.modules.facturador.service.targetPort }}
{{- end }}