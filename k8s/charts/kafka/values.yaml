# Valores iniciales basados en el broker unico KRaft de Compose.
replicaCount: null

image:
  repository: apache/kafka
  tag: "4.0.2"
  pullPolicy: IfNotPresent

service:
  name: kafka
  type: ClusterIP
  clusterIP: None
  clientPort: 9092
  controllerPort: 9093

kraft:
  nodeId: 1
  processRoles:
    - broker
    - controller
  listenerSecurityProtocolMap:
    CONTROLLER: PLAINTEXT
    PLAINTEXT: PLAINTEXT
  listeners:
    - PLAINTEXT://:9092
    - CONTROLLER://:9093
  advertisedListeners:
    - PLAINTEXT://kafka:9092
  controllerQuorumVoters:
    - 1@kafka:9093
  controllerListenerNames:
    - CONTROLLER
  offsetsTopicReplicationFactor: 1
  transactionStateLogReplicationFactor: 1
  transactionStateLogMinIsr: 1
  groupInitialRebalanceDelayMs: 0

persistence:
  enabled: true
  mountPath: /var/lib/kafka/data
  size: ""
  accessModes:
    - ReadWriteOnce
  storageClassName: ""

# Recursos y probes se configuran por ambiente.
resources: {}
probes: {}
