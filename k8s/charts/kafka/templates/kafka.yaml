apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
  labels:
    app.kubernetes.io/name: kafka
spec:
  type: {{ .Values.service.type }}
  clusterIP: {{ .Values.service.clusterIP }}
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: client
      port: {{ .Values.service.clientPort }}
      targetPort: client
    - name: controller
      port: {{ .Values.service.controllerPort }}
      targetPort: controller
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
spec:
  serviceName: {{ .Values.service.name }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
    spec:
      containers:
        - name: kafka
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: client
              containerPort: {{ .Values.service.clientPort }}
            - name: controller
              containerPort: {{ .Values.service.controllerPort }}
          env:
            - name: KAFKA_LOG_DIRS
              value: {{ .Values.persistence.mountPath | quote }}
            - name: KAFKA_NODE_ID
              value: {{ .Values.kraft.nodeId | quote }}
            - name: KAFKA_PROCESS_ROLES
              value: {{ join "," .Values.kraft.processRoles | quote }}
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: {{ .Values.kraft.listenerSecurityProtocolMap | quote }}
            - name: KAFKA_LISTENERS
              value: {{ join "," .Values.kraft.listeners | quote }}
            - name: KAFKA_ADVERTISED_LISTENERS
              value: {{ join "," .Values.kraft.advertisedListeners | quote }}
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: {{ join "," .Values.kraft.controllerQuorumVoters | quote }}
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: {{ join "," .Values.kraft.controllerListenerNames | quote }}
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: {{ .Values.kraft.offsetsTopicReplicationFactor | quote }}
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: {{ .Values.kraft.transactionStateLogReplicationFactor | quote }}
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: {{ .Values.kraft.transactionStateLogMinIsr | quote }}
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: {{ .Values.kraft.groupInitialRebalanceDelayMs | quote }}
          volumeMounts:
            - name: datos
              mountPath: {{ .Values.persistence.mountPath }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:{{ .Values.service.clientPort }} >/dev/null 2>&1
{{ toYaml .Values.probes.startup | indent 12 }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:{{ .Values.service.clientPort }} >/dev/null 2>&1
{{ toYaml .Values.probes.liveness | indent 12 }}
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:{{ .Values.service.clientPort }} >/dev/null 2>&1
{{ toYaml .Values.probes.readiness | indent 12 }}
      {{- if not .Values.persistence.enabled }}
      volumes:
        - name: datos
          emptyDir: {}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: datos
      spec:
        accessModes:
{{ toYaml .Values.persistence.accessModes | indent 10 }}
        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
