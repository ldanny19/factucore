# Capacidades, probes, réplicas y persistencia del ambiente production.
# Ajustar CPU, memoria y almacenamiento según métricas y capacidad real del clúster.
# Los módulos que comparten PVC ReadWriteOnce quedan en 1 réplica hasta definir almacenamiento compartido/HA.
# La habilitación de módulos se administra en k8s/values.yaml.
# El namespace se crea y administra por separado en ../namespaces/prod.yaml.

vault:
  agent:
    replicas: 1
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }
    probes:
      startup: { periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 24 }
      liveness: { periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3 }
      readiness: { periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 3 }
  server:
    replicas: 1
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits: { cpu: 2, memory: 2Gi }
    probes:
      startup: { periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 36 }
      liveness: { periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3 }
      readiness: { periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 3 }
  initContainers:
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 250m, memory: 256Mi }
  persistence:
    data: 20Gi
    bootstrap: 100Mi
    agentToken: 100Mi
    runtimeSecrets: 2Gi
  storage:
    temporarySizeLimit: 128Mi

basedatos:
  replicaCount: 1
  resources:
    requests: { cpu: 1, memory: 2Gi }
    limits: { cpu: 2, memory: 4Gi }
  probes:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  storage:
    size: 50Gi
    storageClassName: ""

auth:
  replicaCount: 1
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: 2, memory: 2Gi }
  probes:
    startup: { periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 30 }
    readiness: { periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 12 }
    liveness: { periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 6 }

kafka:
  replicaCount: 1
  resources:
    requests: { cpu: 1, memory: 2Gi }
    limits: { cpu: 2, memory: 4Gi }
  probes:
    startup: { periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 30 }
    readiness: { periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 12 }
    liveness: { periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 6 }
  persistence:
    size: 50Gi
    storageClassName: ""

facturador:
  replicaCount: 1
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: 2, memory: 2Gi }
  probes:
    startup: { periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 30 }
    readiness: { periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 12 }
    liveness: { periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 6 }
  storage:
    documentos: 50Gi
    certificados: 5Gi
    imagenes: 5Gi
    logs: 10Gi

notificacion:
  replicaCount: 1
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: 1, memory: 1Gi }
  probes:
    startup: { periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 30 }
    readiness: { periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 12 }
    liveness: { periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 6 }
  storage:
    logs: 10Gi

apigateway:
  replicaCount: 2
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: 1, memory: 512Mi }
  probes:
    startup: { periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 30 }
    readiness: { periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 12 }
    liveness: { periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 6 }

web:
  replicaCount: 2
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: 1, memory: 512Mi }
  probes:
    startup: { periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 30 }
    readiness: { periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 6 }
    liveness: { periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 6 }

quotas:
  resourceQuota:
    hard:
      requests.cpu: "16"
      requests.memory: 32Gi
      limits.cpu: "32"
      limits.memory: 64Gi
      requests.storage: 250Gi
      persistentvolumeclaims: "30"
      pods: "50"
      services: "40"
      configmaps: "50"
  limitRange:
    limits:
      - type: Container
        min:
          cpu: 10m
          memory: 16Mi
        max:
          cpu: "4"
          memory: 8Gi
        defaultRequest:
          cpu: 250m
          memory: 256Mi
        default:
          cpu: "1"
          memory: 1Gi
