# ============================================================
# FACTUCORE - FACTURADOR
# CONFIGURACION EXTERNA
# ============================================================

spring:
  config:
    import: "optional:configtree:/run/secrets/"
  application:
    name: facturador

  messages:
    basename: "file:${factucore.path.config}/messages"
    encoding: UTF-8
    fallback-to-system-locale: false

  main:
    banner-mode: off

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: FactuCoreHikariCP
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Guayaquil

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: ec.dalara.factucore.*
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}

server:
  port: 8080
  servlet:
    context-path: /factucore-api

camel:
  main:
    routes-include-pattern: ${factucore.workflow.rutas.facturacion}

factucore:
  messaging:
    enabled: true
    broker: KAFKA

  path:
    base: ${FACTUCORE_PATH_BASE:/app}
    config: ${FACTUCORE_PATH_CONFIG:${factucore.path.base}/config}
    certificados: ${FACTUCORE_PATH_CERTIFICADOS:${factucore.path.base}/certificados}
    jasper: ${FACTUCORE_PATH_JASPER:${factucore.path.base}/jasper}
    documentos: ${FACTUCORE_PATH_DOCUMENTOS:${factucore.path.base}/documentos}
    documentos-xml: ${FACTUCORE_PATH_DOCUMENTOS_XML:${factucore.path.documentos}/xml}
    documentos-pdf: ${FACTUCORE_PATH_DOCUMENTOS_PDF:${factucore.path.documentos}/pdf}
    logs: ${FACTUCORE_PATH_LOGS:${factucore.path.base}/logs}

  firma:
    password: ${FACTUCORE_FIRMA_PASSWORD}

  sri:
    ambiente: ${FACTUCORE_SRI_AMBIENTE:PRUEBAS}

    pruebas:
      recepcion-url: ${FACTUCORE_SRI_PRUEBAS_RECEPCION_URL:https://celcer.sri.gob.ec/comprobantes-electronicos-ws/RecepcionComprobantesOffline}
      autorizacion-url: ${FACTUCORE_SRI_PRUEBAS_AUTORIZACION_URL:https://celcer.sri.gob.ec/comprobantes-electronicos-ws/AutorizacionComprobantesOffline}

    produccion:
      recepcion-url: ${FACTUCORE_SRI_PRODUCCION_RECEPCION_URL:https://cel.sri.gob.ec/comprobantes-electronicos-ws/RecepcionComprobantesOffline}
      autorizacion-url: ${FACTUCORE_SRI_PRODUCCION_AUTORIZACION_URL:https://cel.sri.gob.ec/comprobantes-electronicos-ws/AutorizacionComprobantesOffline}

    envio:
      max-intentos: ${FACTUCORE_SRI_ENVIO_MAX_INTENTOS:3}
      espera-ms: ${FACTUCORE_SRI_ENVIO_ESPERA_MS:5000}

    autorizacion:
      espera-ms: ${FACTUCORE_SRI_AUTORIZACION_ESPERA_MS:5000}
      max-intentos: ${FACTUCORE_SRI_AUTORIZACION_MAX_INTENTOS:3}
      espera-consulta-ms: ${FACTUCORE_SRI_AUTORIZACION_ESPERA_CONSULTA_MS:5000}

  logging:
    ruta: ${factucore.path.logs}

  notificacion:
    topico: ${FACTUCORE_NOTIFICACION_TOPICO:factucore.notificacion.comprobante}
    tipo-evento: ${FACTUCORE_NOTIFICACION_TIPO_EVENTO:COMPROBANTE_AUTORIZADO}
    version-evento: ${FACTUCORE_NOTIFICACION_VERSION_EVENTO:1.0}

  workflow:
    motor: apache-camel
    version: 4.10.7
    rutas:
      facturacion: ${FACTUCORE_WORKFLOW_RUTA_FACTURACION:file:${factucore.path.config}/camel/facturacion.xml}
    reproceso:
      habilitado: ${FACTUCORE_WORKFLOW_REPROCESO_HABILITADO:true}
      bloqueo-ms: ${FACTUCORE_WORKFLOW_REPROCESO_BLOQUEO_MS:60000}

  kafka:
    topics:
      notificacion-comprobante: ${FACTUCORE_KAFKA_TOPIC_NOTIFICACION_COMPROBANTE:factucore.notificacion.comprobante}
