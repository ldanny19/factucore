server:
  port: 8080

spring:
  application:
    name: factucore-notificacion
  messages:
    basename: "file:${factucore.notificacion.path.config}/messages"

  mail:
    host: ${FACTUCORE_NOTIFICACION_SMTP_HOST}
    port: ${FACTUCORE_NOTIFICACION_SMTP_PORT:587}
    username: ${FACTUCORE_NOTIFICACION_SMTP_USERNAME}
    password: ${FACTUCORE_NOTIFICACION_SMTP_PASSWORD}
    properties:
      mail.smtp.auth: ${FACTUCORE_NOTIFICACION_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${FACTUCORE_NOTIFICACION_SMTP_STARTTLS:true}

factucore:
  logging:
    nivel: ${FACTUCORE_LOGGING_NIVEL:INFO}
    ruta: ${FACTUCORE_LOGGING_RUTA:./logs}
    archivo: ${FACTUCORE_LOGGING_ARCHIVO:factucore-notificacion.log}

  messaging:
    enabled: ${FACTUCORE_MESSAGING_ENABLED:true}
    broker: ${FACTUCORE_MESSAGING_BROKER:KAFKA}
    kafka:
      bootstrap-servers: ${FACTUCORE_MESSAGING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      consumer:
        auto-offset-reset: earliest
        enable-auto-commit: false
        concurrency: 1
    rabbitmq:
      addresses: ${FACTUCORE_MESSAGING_RABBITMQ_ADDRESSES:localhost:5672}
      username: ${FACTUCORE_MESSAGING_RABBITMQ_USERNAME:guest}
      password: ${FACTUCORE_MESSAGING_RABBITMQ_PASSWORD:guest}
      virtual-host: ${FACTUCORE_MESSAGING_RABBITMQ_VIRTUAL_HOST:/}

  notificacion:
    path:
      config: __CONFIG__
    topico: ${FACTUCORE_NOTIFICACION_TOPICO:factucore.notificacion.comprobante}
    correo:
      remitente: ${FACTUCORE_NOTIFICACION_CORREO_REMITENTE}
      asunto: ${FACTUCORE_NOTIFICACION_CORREO_ASUNTO:Comprobante electrónico autorizado}
    plantilla:
      ruta: ${FACTUCORE_NOTIFICACION_PLANTILLA_RUTA:/app/config/plantillas/comprobante-autorizado.html}

management:
  endpoints:
    web:
      exposure:
        include: health,info
