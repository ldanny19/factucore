server:
  port: 8080

spring:
  config:
    import: "optional:configtree:/run/secrets/"
  application:
    name: factucore-notificacion
  messages:
    basename: "file:${notificacion.path.config}/messages"
    encoding: UTF-8
    fallback-to-system-locale: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/db_notificaciones}
    username: ${SPRING_DATASOURCE_USERNAME:usr_notificaciones}
    password: ${postgres_notificaciones_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ing.dlamilla@gmail.com
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.ssl.enable: false
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

factucore:
  logging:
    nivel: INFO
    ruta: ./logs
    archivo: factucore-notificacion.log

  messaging:
    enabled: true

    resiliencia:
      reintentos:
        intervalo-ms: 5000
        max-intentos: 3
        dlq-habilitada: true
        sufijo-dlq: .DLQ
      timeout:
        conexion-ms: 5000
        envio-ms: 10000

    conexiones:
      broker-principal:
        tipo: KAFKA
        kafka:
          bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
          client-id: factucore-notificacion
          security-protocol: PLAINTEXT
          producer:
            acks: all
          consumer:
            auto-offset-reset: earliest
            enable-auto-commit: false
            concurrency: 1
        rabbitmq:
          addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
          username: ${RABBITMQ_USERNAME:guest}
          password: ${rabbitmq_password:}
          virtual-host: /
          exchange-type: topic
          exchange-prefix: factucore
          durable: true
          concurrency: 1
          connection-timeout-ms: 5000
          channel-cache-size: 25
          connection-limit: 10

    destinos:
      notificacion:
        conexion: broker-principal
        nombre: notificacion

notificacion:
  path:
    config: ${FACTUCORE_PATH_CONFIG:/app/config}
  correo:
    remitente: ing.dlamilla@gmail.com
    asunto: Comprobante electrónico autorizado
  plantilla:
    ruta: /app/config/plantillas/comprobante-autorizado.html
  reintentos:
    max-intentos: 5
    espera-reintento-ms: 60000
  recuperacion:
    intervalo-ms: 30000
