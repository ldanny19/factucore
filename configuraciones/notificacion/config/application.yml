server:
  port: 8080

spring:
  config:
    import: optional:configtree:/run/secrets/
  application:
    name: factucore-notificacion
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${basedatos_notificaciones_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: FactuCoreNotificacionHikariCP
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  messages:
    basename: "file:${factucore.notificacion.path.config}/messages"

  mail:
    host: smtp.gmail.com
    port: 587
    username: cls.dlamilla@gmail.com
    password: ${mail_password}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

factucore:
  logging:
    nivel: ${FACTUCORE_LOGGING_NIVEL:INFO}
    ruta: ${FACTUCORE_LOGGING_RUTA:./logs}
    archivo: ${FACTUCORE_LOGGING_ARCHIVO:factucore-notificacion.log}

  messaging:
    enabled: true
    broker: KAFKA

    resiliencia:
      reintentos:
        intervalo-ms: 5000
        max-intentos: 3
        dlq-habilitada: true
        sufijo-dlq: .DLQ
      timeout:
        conexion-ms: 5000
        envio-ms: 10000

    conexiones:
      broker-principal:
        tipo: KAFKA
        kafka:
          bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
          client-id: factucore-notificacion
          security-protocol: PLAINTEXT
          producer:
            acks: all
          consumer:
            auto-offset-reset: earliest
            enable-auto-commit: false
            concurrency: 1
        rabbitmq:
          addresses: ${FACTUCORE_MESSAGING_RABBITMQ_ADDRESSES:localhost:5672}
          username: ${FACTUCORE_MESSAGING_RABBITMQ_USERNAME:guest}
          password: ${FACTUCORE_MESSAGING_RABBITMQ_PASSWORD:guest}
          virtual-host: ${FACTUCORE_MESSAGING_RABBITMQ_VIRTUAL_HOST:/}
          exchange-type: topic
          exchange-prefix: factucore
          durable: true
          concurrency: 1
          connection-timeout-ms: 5000
          channel-cache-size: 25
          connection-limit: 10

    destinos:
      notificacion:
        conexion: broker-principal
        nombre: ${FACTUCORE_NOTIFICACION_TOPICO:notificacion}

  notificacion:
    path:
      config: __CONFIG__
    topico: ${FACTUCORE_NOTIFICACION_TOPICO:notificacion}
    correo:
      remitente: ${FACTUCORE_NOTIFICACION_CORREO_REMITENTE}
      asunto: ${FACTUCORE_NOTIFICACION_CORREO_ASUNTO:Comprobante electrónico autorizado}
    plantilla:
      ruta: ${FACTUCORE_NOTIFICACION_PLANTILLA_RUTA:/app/config/plantillas/comprobante-autorizado.html}
    reintentos:
      max-intentos: ${FACTUCORE_NOTIFICACION_MAX_INTENTOS:5}
      espera-reintento-ms: ${FACTUCORE_NOTIFICACION_ESPERA_REINTENTO_MS:60000}
