log_format factucore
    '$remote_addr - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent '
    'request_id=$request_id '
    'request_time=$request_time '
    'upstream_response_time=$upstream_response_time';

access_log /var/log/nginx/access.log factucore;
error_log /var/log/nginx/error.log warn;

server {
    listen 80;
    server_name api.facturador.com;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Keycloak se publica bajo /auth; el realm forma parte de su URL OIDC.
    location ^~ /auth/ {
        proxy_pass http://auth-server:8080/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # El context-path público e interno de Spring Boot es el mismo.
    location ^~ /facturador-api/ {
        proxy_pass http://facturador:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
