spring:
  application:
    name: factucore-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      routes:
        - id: facturador
          uri: ${FACTUCORE_GATEWAY_FACTURADOR_URI:http://facturador:8080}
          predicates:
            - Path=/api/facturador/**
          filters:
            - StripPrefix=2
            - PrefixPath=/factucore-api

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: FactuCore API Gateway
    description: Entrada HTTP para las API REST de FactuCore.
    version: 1.0.0
