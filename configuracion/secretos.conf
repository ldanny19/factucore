# Catalogo central de secretos de FactuCore.
# Formato: clave|ruta Vault|usuario tecnico (vacio si no aplica)|descripcion para el instalador
# No incluir contrasenas ni otros valores sensibles.
postgres_admin|secret/factucore/basedatos/admin|postgres|Contrasena del administrador de PostgreSQL (postgres)
postgres_facturador|secret/factucore/basedatos/facturador|usr_factucore|Contrasena de PostgreSQL para Facturador (usr_factucore)
postgres_auth|secret/factucore/basedatos/auth|usr_auth|Contrasena de PostgreSQL para Auth Server (usr_auth)
postgres_notificaciones|secret/factucore/basedatos/notificaciones|usr_notificaciones|Contrasena de PostgreSQL para Notificaciones (usr_notificaciones)
keycloak_admin|secret/factucore/keycloak||Contrasena del administrador de Keycloak
smtp|secret/factucore/mail||Contrasena SMTP de Notificaciones
firma|secret/factucore/firma||Contrasena del certificado de firma electronica
