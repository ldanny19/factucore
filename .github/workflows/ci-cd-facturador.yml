name: CI/CD facturador

on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: CI JAVA Facturador
    uses: ldanny19/devops-pipeline-templates/.github/workflows/ci-java.yml@d8c17e7211e2d96f8e38f049d15b34322798b085
    with:
      java_version: '21'
      java_distribution: temurin
      build_tool: maven
      build_tool_version: '3.9.9'
      working_directory: facturador
      execute_build: true
      execute_docker: true\n      artifact_name: facturador
      docker_image: ghcr.io/ldanny19/facturador
      dependency_artifact_name: factucore-messaging
      dependency_group_id: ec.dalara.factucore
      dependency_artifact_id: factucore-messaging
      dependency_version: '1.0.0'
    secrets: inherit

  cd:
    name: CD JAVA
    needs: ci
    if: github.ref == 'refs/heads/main'
    uses: ldanny19/devops-pipeline-templates/.github/workflows/cd-java.yml@54e6f4d0067981f782c126c37f0851975245181f
    with:
      environment: production
      docker_image: ${{ needs.ci.outputs.image }}
      deploy_path: ${{ vars.DEPLOY_PATH }}
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
