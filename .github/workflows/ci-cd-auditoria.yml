name: CI Auditoria

on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: CI JAVA Auditoria
    uses: ldanny19/devops-pipeline-templates/.github/workflows/ci-java.yml@7963c2d6109dcda478bb9d5ef0315edfb9bba6d1
    with:
      java_version: '21'
      java_distribution: temurin
      build_tool: maven
      build_tool_version: '3.9.9'
      working_directory: auditoria
      execute_build: true
      execute_docker: false
      artifact_name: auditoria
      dependency_artifact_name: factucore-messaging
      dependency_group_id: ec.dalara.factucore
      dependency_artifact_id: factucore-messaging
      dependency_version: '1.0.0'
    secrets: inherit
