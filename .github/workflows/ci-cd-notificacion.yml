name: CI Notificacion

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: CI JAVA Notificacion
    uses: ldanny19/devops-pipeline-templates/.github/workflows/ci-java.yml@cbd54f40b17b613e1fd7ec8a0f86f579d1aac169
    with:
      java_version: '21'
      java_distribution: temurin
      build_tool: maven
      build_tool_version: '3.9.9'
      working_directory: notificacion
      execute_build: true
      execute_docker: false
      dependency_artifact_name: factucore-messaging
      dependency_group_id: ec.dalara.factucore
      dependency_artifact_id: factucore-messaging
      dependency_version: '1.0.0'
