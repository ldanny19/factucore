name: CI Notificacion

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: CI JAVA Notificacion
    uses: ldanny19/devops-pipeline-templates/.github/workflows/ci-java.yml@d8c17e7211e2d96f8e38f049d15b34322798b085
    with:
      java_version: '21'
      java_distribution: temurin
      build_tool: maven
      build_tool_version: '3.9.9'
      working_directory: notificacion
      execute_build: true
      execute_docker: false\n      artifact_name: notificacion
      dependency_artifact_name: factucore-messaging
      dependency_group_id: ec.dalara.factucore
      dependency_artifact_id: factucore-messaging
      dependency_version: '1.0.0'
