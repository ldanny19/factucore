name: CI/CD factucore-messaging

on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: CI JAVA Messaging
    uses: ldanny19/devops-pipeline-templates/.github/workflows/ci-java.yml@7630a9793972442feb49e2cb03cf13678f146bb5
    with:
      java_version: '21'
      java_distribution: temurin
      build_tool: maven
      build_tool_version: '3.9.9'
      working_directory: factucore-messaging
      execute_build: true
      execute_docker: false
      publish_artifact: true
      artifact_name: factucore-messaging
