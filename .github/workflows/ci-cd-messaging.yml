
name: CI/CD factucore-messaging

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main

jobs:
  ci:
    name: CI JAVA
    uses: ldanny19/devops-pipeline-templates/.github/workflows/ci-java.yml@5e64ee7465f6e521f1a52429a490c413cd10ef99
    with:
      java_version: '21'
      java_distribution: temurin
      build_tool: maven
      build_tool_version: '3.9.9'
      working_directory: .
      execute_build: true
      execute_docker: false

  
