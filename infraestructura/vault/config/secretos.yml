# Catálogo central de secretos de FactuCore.
# Define metadatos y rutas de Vault; no almacena valores sensibles.
# El instalador requiere yq v4 para generar el catálogo plano utilizado por los scripts de Vault.

secretos:
  basedatos_admin:
    ruta: secret/factucore/basedatos/admin
    usuario: postgres
    descripcion: "Contraseña del administrador de la base de datos"

  basedatos_facturador:
    ruta: secret/factucore/basedatos/facturador
    usuario: usr_factucore
    descripcion: "Contraseña de base de datos para Facturador (usr_factucore)"

  basedatos_auth:
    ruta: secret/factucore/basedatos/auth
    usuario: usr_auth
    descripcion: "Contraseña de base de datos para Auth Server (usr_auth)"

  basedatos_notificaciones:
    ruta: secret/factucore/basedatos/notificaciones
    usuario: usr_notificaciones
    descripcion: "Contraseña de base de datos para Notificaciones (usr_notificaciones)"

  keycloak_admin:
    ruta: secret/factucore/keycloak
    descripcion: "Contraseña del administrador de Keycloak"

  mail:
    ruta: secret/factucore/mail
    descripcion: "Contraseña SMTP de Notificaciones"

  firma:
    ruta: secret/factucore/firma
    descripcion: "Contraseña del certificado de firma electrónica"
